# Which Claude Doc each file is synced from. Update rev and synced on every sync.
# One entry per synced file in this folder. Repo-authored files (README.md) are not listed.
docs:
  - file: brief.md
    title: "Product Brief"
    source: https://claude.ai/artifact/<id>
    rev: 1
    synced: YYYY-MM-DD
    type: brief
    status: draft
